# 整个文件采用 TOML 语法（https://toml.io/cn/）
# 所有 ${ENV_VAR} 形式的值均从环境变量读取，启动前务必注入，否则配置解析会失败。

[common]
# 应用全局时区，影响日志时间戳、数据库时间字段、JWT 过期时间等。
# 建议与服务器系统时区保持一致，避免“时间漂移”。
timezone = "Asia/Shanghai"

[log]
# 日志级别（从高到低）：
# CRITICAL > ERROR > WARNING > INFO > DEBUG > TRACE
# 只输出 >= 该级别的日志
# 说明：
#   - 生产环境建议 WARNING 或 ERROR，减少磁盘占用
#   - 本地开发可调成 DEBUG 或 TRACE，方便排障
level = "DEBUG"

# 写进文件的日志级别，独立控制，防止控制台刷爆
# 例如：控制台看 DEBUG，文件只存 WARNING 及以上
file_level = "WARNING"

[redis]
# Redis 缓存节点，用于分布式锁、会话、热点数据缓存等
host = "106.14.58.94"
port = "6379"
# 密码通过环境变量 REDIS_PASSWORD 注入，避免明文落盘
# 如果 Redis 未启用 AUTH，可置空字符串：REDIS_PASSWORD=""
password = "${REDIS_PASSWORD}"

[postgresql]
# 主数据库配置，NoteLIDB 为业务库名
host = "106.14.58.94"
port = "5432"
# 账号、密码分离，方便不同环境（dev/prod）使用不同凭据
username = "${PSQL_USERNAME}"
password = "${PSQL_PASSWORD}"
DBName = "NoteLIDB"
# 连接池参数未列出，可按需在代码层补充：
#   max_open_conns = 50
#   max_idle_conns = 10
#   conn_max_lifetime = "1h"

[jwt]
# HS256 签名密钥，必须是 256 bit（32 字节）十六进制串
# 生成命令：openssl rand -hex 32
secret_key = "${JWT_SECRET_KEY}"
algorithm = "HS256"
# Access Token 过期时间，分钟为单位
# 可根据业务敏感度调整，越短越安全，但会增加刷新频率
access_token_expire_minutes = 30
# Refresh Token 过期时间，天为单位
refresh_token_expire_days = 30